<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PPP Database Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="header__brand">
        <div class="header__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
          </svg>
        </div>
        <div class="header__titles">
          <h1 class="header__title">PPP Database Manager</h1>
          <p class="header__subtitle">Official government PPP registries</p>
        </div>
      </div>
      <span class="header__count" id="country-count" aria-live="polite"></span>
    </header>

    <div class="search">
      <div class="search__field">
        <span class="search__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input
          type="text"
          id="search-input"
          class="search__input"
          placeholder="Search a country…"
          autocomplete="off"
          spellcheck="false"
          autofocus
        />
        <button type="button" id="search-clear" class="search__clear" hidden aria-label="Clear search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <main class="content">
      <div id="country-list" class="country-list" role="list"></div>

      <div id="empty-state" class="empty-state" hidden>
        <span class="empty-state__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </span>
        <p class="empty-state__title">No country found</p>
        <p class="empty-state__hint">Try a different spelling or clear the search.</p>
      </div>

      <div id="error-state" class="empty-state empty-state--error" hidden>
        <p class="empty-state__title">Unable to load countries</p>
        <p class="empty-state__hint">countries.json is missing or invalid.</p>
      </div>
    </main>

    <footer class="footer">
      <span class="footer__brand">Suterra · Internal Tool</span>
      <span class="footer__version" id="app-version"></span>
    </footer>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
